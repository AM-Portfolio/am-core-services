name: AM SDK Publish

# External client SDKs only (Feign/OpenAPI clients consumed outside am-core-services).
# Internal libraries and domains are published by core-libraries-publish.yml.

on:
  push:
    branches: [main, master, 'feature/**', 'hotfix/**', 'fix/**']
    paths:
      - "pom.xml"
      - "libraries/am-analysis-client-lib/**"
      - "libraries/am-market-client-lib/**"
      - "libraries/am-portfolio-client-lib/**"
      - "libraries/am-trade-client-lib/**"
      - "services/am-analysis/am-analysis-sdk/**"
      - ".github/workflows/am-sdk-publish.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "libraries/am-analysis-client-lib/**"
      - "libraries/am-market-client-lib/**"
      - "libraries/am-portfolio-client-lib/**"
      - "libraries/am-trade-client-lib/**"
      - "services/am-analysis/am-analysis-sdk/**"
      - ".github/workflows/am-sdk-publish.yml"
  workflow_run:
    workflows: ["Core Libraries Publish"]
    types: [completed]
    branches: [main, master, 'feature/**', 'hotfix/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: am-sdk-publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed SDKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      analysis-client-sdk: ${{ steps.check.outputs.analysis-client-sdk }}
      analysis-client-lib: ${{ steps.check.outputs.analysis-client-lib }}
      market-client-lib: ${{ steps.check.outputs.market-client-lib }}
      portfolio-client-lib: ${{ steps.check.outputs.portfolio-client-lib }}
      trade-client-lib: ${{ steps.check.outputs.trade-client-lib }}
      any: ${{ steps.check.outputs.any }}
      publish_ref: ${{ steps.resolve_ref.outputs.publish_ref }}
      skip_workflow: ${{ steps.resolve_ref.outputs.skip_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve publish ref (pre-bump when Core Libraries ends with version bump)
        id: resolve_ref
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          git checkout "$HEAD_SHA"
          MSG=$(git log -1 --format=%s "$HEAD_SHA")
          echo "Workflow head: $HEAD_SHA ($MSG)"

          if [ "${{ github.event_name }}" = "workflow_run" ] && echo "$MSG" | grep -qiE 'bump (parent and submodules|version) to next snapshot'; then
            if ! git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              echo "Bump commit has no parent — skipping SDK publish."
              echo "skip_workflow=true" >> "$GITHUB_OUTPUT"
              echo "publish_ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PUBLISH_REF=$(git rev-parse "${HEAD_SHA}^")
            echo "Core Libraries bump commit detected — SDK publish will use pre-bump ref: $PUBLISH_REF"
            echo "publish_ref=$PUBLISH_REF" >> "$GITHUB_OUTPUT"
            echo "skip_workflow=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "skip_workflow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect which SDK paths changed
        id: check
        if: steps.resolve_ref.outputs.skip_workflow != 'true'
        run: |
          git checkout "${{ steps.resolve_ref.outputs.publish_ref }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Compare the publish ref to its parent (real code change), not the bump commit diff.
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            else
              CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED"

          path_changed() { echo "$CHANGED" | grep -q "^$1"; }

          root_pom=false
          analysis_client_sdk=false
          analysis_client_lib=false
          market_client_lib=false
          portfolio_client_lib=false
          trade_client_lib=false

          path_changed "pom.xml" && root_pom=true
          path_changed "services/am-analysis/am-analysis-sdk/" && analysis_client_sdk=true
          path_changed "libraries/am-analysis-client-lib/" && analysis_client_lib=true
          path_changed "libraries/am-market-client-lib/" && market_client_lib=true
          path_changed "libraries/am-portfolio-client-lib/" && portfolio_client_lib=true
          path_changed "libraries/am-trade-client-lib/" && trade_client_lib=true

          # am-analysis-client-lib wraps the generated am-analysis-client. Build/publish
          # both when either side or the root reactor POM changes; no dummy lib edit needed.
          if [ "$root_pom" = true ] || [ "$analysis_client_sdk" = true ] || [ "$analysis_client_lib" = true ]; then
            analysis_client_sdk=true
            analysis_client_lib=true
          fi

          echo "analysis-client-sdk=${analysis_client_sdk}" >> "$GITHUB_OUTPUT"
          echo "analysis-client-lib=${analysis_client_lib}" >> "$GITHUB_OUTPUT"
          echo "market-client-lib=${market_client_lib}" >> "$GITHUB_OUTPUT"
          echo "portfolio-client-lib=${portfolio_client_lib}" >> "$GITHUB_OUTPUT"
          echo "trade-client-lib=${trade_client_lib}" >> "$GITHUB_OUTPUT"

          if [ "$analysis_client_sdk" = true ] \
            || [ "$analysis_client_lib" = true ] \
            || [ "$market_client_lib" = true ] \
            || [ "$portfolio_client_lib" = true ] \
            || [ "$trade_client_lib" = true ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  verify-sdks:
    name: Verify changed SDKs (PR)
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.skip_workflow != 'true'
      && github.event_name == 'pull_request'
      && needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.publish_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Build changed SDK modules
        run: |
          MODULES=()
          [ "${{ needs.detect-changes.outputs.analysis-client-sdk }}" = "true" ] && MODULES+=("services/am-analysis/am-analysis-sdk/java-sdk")
          [ "${{ needs.detect-changes.outputs.analysis-client-lib }}" = "true" ] && MODULES+=("libraries/am-analysis-client-lib")
          [ "${{ needs.detect-changes.outputs.market-client-lib }}" = "true" ] && MODULES+=("libraries/am-market-client-lib")
          [ "${{ needs.detect-changes.outputs.portfolio-client-lib }}" = "true" ] && MODULES+=("libraries/am-portfolio-client-lib")
          [ "${{ needs.detect-changes.outputs.trade-client-lib }}" = "true" ] && MODULES+=("libraries/am-trade-client-lib")
          PL=$(IFS=, ; echo "${MODULES[*]}")
          mvn -B clean verify -pl "$PL" -am -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  publish-analysis-client-sdk:
    name: Publish am-analysis-client (java-sdk)
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.skip_workflow != 'true'
      && (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/heads/fix/'))
      && needs.detect-changes.outputs.analysis-client-sdk == 'true'
      && (github.event_name == 'workflow_run' || (!contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') && !contains(github.event.head_commit.message, 'bump version to next snapshot version')))
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: "java"
      working_directory: "services/am-analysis/am-analysis-sdk/java-sdk"
      sdk_name: "am-analysis-client"
      use_release_version: true
      git_ref: ${{ needs.detect-changes.outputs.publish_ref }}
    secrets: inherit

  publish-analysis-client-lib:
    name: Publish am-analysis-client-lib
    needs: [detect-changes, publish-analysis-client-sdk]
    if: >-
      needs.detect-changes.outputs.skip_workflow != 'true'
      && always()
      && (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/heads/fix/'))
      && needs.detect-changes.outputs.analysis-client-lib == 'true'
      && (needs.publish-analysis-client-sdk.result == 'success' || needs.publish-analysis-client-sdk.result == 'skipped')
      && (github.event_name == 'workflow_run' || (!contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') && !contains(github.event.head_commit.message, 'bump version to next snapshot version')))
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: "java"
      working_directory: "libraries/am-analysis-client-lib"
      sdk_name: "am-analysis-client-lib"
      use_release_version: true
      git_ref: ${{ needs.detect-changes.outputs.publish_ref }}
    secrets: inherit

  publish-market-client-lib:
    name: Publish am-market-client-lib
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.skip_workflow != 'true'
      && (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/heads/fix/'))
      && needs.detect-changes.outputs.market-client-lib == 'true'
      && (github.event_name == 'workflow_run' || (!contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') && !contains(github.event.head_commit.message, 'bump version to next snapshot version')))
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: "java"
      working_directory: "libraries/am-market-client-lib"
      sdk_name: "am-market-client-lib"
      use_release_version: true
      git_ref: ${{ needs.detect-changes.outputs.publish_ref }}
    secrets: inherit

  publish-portfolio-client-lib:
    name: Publish am-portfolio-client-lib
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.skip_workflow != 'true'
      && (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/heads/fix/'))
      && needs.detect-changes.outputs.portfolio-client-lib == 'true'
      && (github.event_name == 'workflow_run' || (!contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') && !contains(github.event.head_commit.message, 'bump version to next snapshot version')))
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: "java"
      working_directory: "libraries/am-portfolio-client-lib"
      sdk_name: "am-portfolio-client-lib"
      use_release_version: true
      git_ref: ${{ needs.detect-changes.outputs.publish_ref }}
    secrets: inherit

  publish-trade-client-lib:
    name: Publish am-trade-client-lib
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.skip_workflow != 'true'
      && (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/heads/fix/'))
      && needs.detect-changes.outputs.trade-client-lib == 'true'
      && (github.event_name == 'workflow_run' || (!contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') && !contains(github.event.head_commit.message, 'bump version to next snapshot version')))
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: "java"
      working_directory: "libraries/am-trade-client-lib"
      sdk_name: "am-trade-client-lib"
      use_release_version: true
      git_ref: ${{ needs.detect-changes.outputs.publish_ref }}
    secrets: inherit
