name: MCP Server Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - 'services/am-mcp-server/**'
      - '.github/workflows/am-mcp-server.yml'
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - 'services/am-mcp-server/**'
      - '.github/workflows/am-mcp-server.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Publish MCP Server
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: 'java'
      working_directory: 'services/am-mcp-server'
      image_name: 'am-mcp-server'
      build_context: '.'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      deploy_prod: false
    secrets: inherit
