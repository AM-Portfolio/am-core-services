name: Analysis Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - 'services/am-analysis/**'
      - '.github/workflows/am-analysis.yml'
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - 'services/am-analysis/**'
      - '.github/workflows/am-analysis.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Analysis
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: 'java'
      working_directory: 'services/am-analysis'
      image_name: 'am-analysis'
      build_context: '.'
      preprod_namespace: 'am-apps-preprod'
      prod_namespace: 'am-apps-prod'
      deploy_prod: false
    secrets: inherit
