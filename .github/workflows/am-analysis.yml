name: Analysis Publish

on:
  push:
    branches: ["master", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
  pull_request:
    branches: ["master", "main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish Analysis
    permissions:
      # Nested deploy-preprod pushes helm/ci-image.yaml on feature branches.
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: 'java'
      working_directory: 'services/am-analysis'
      image_name: 'am-analysis'
      build_context: '.'
    secrets: inherit
# Trigger pipeline test
# Trigger new push
