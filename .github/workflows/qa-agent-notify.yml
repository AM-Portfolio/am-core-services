# Notify qa-agent for am-analysis pilot when changes land on master/main.
#
# Opt-in: services/am-analysis/qa-agent.yaml (enabled + branches).
# Secrets (repo or org):
#   QA_AGENT_BASE_URL      e.g. https://qa-agent.example or http://host:8150
#   QA_AGENT_GATEWAY_TOKEN Bearer token expected by qa-agent

name: QA Agent Notify

on:
  push:
    branches: [master, main]
    paths:
      - "services/am-analysis/**"
      - ".github/workflows/qa-agent-notify.yml"
  workflow_dispatch:
    inputs:
      head_sha:
        description: Optional override commit SHA
        required: false
        type: string
      branch:
        description: Optional override branch
        required: false
        type: string

concurrency:
  group: qa-agent-notify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-qa-agent:
    name: Trigger qa-agent release-readiness (am-analysis)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read am-analysis qa-agent.yaml
        id: cfg
        run: |
          set -euo pipefail
          MANIFEST="services/am-analysis/qa-agent.yaml"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          if [ ! -f "$MANIFEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing_manifest" >> "$GITHUB_OUTPUT"
            echo "Manifest missing: $MANIFEST — skipping"
            exit 0
          fi
          python3 -m pip install --quiet pyyaml
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import yaml
          from pathlib import Path

          branch = os.environ["BRANCH"]
          data = yaml.safe_load(Path("services/am-analysis/qa-agent.yaml").read_text(encoding="utf-8")) or {}
          enabled = bool(data.get("enabled", False))
          branches = data.get("branches") or []
          service = str(data.get("service") or "am-analysis")
          environment = str(data.get("environment") or "dev")
          if not enabled:
              print("skip=true")
              print("reason=disabled")
          elif branches and branch not in branches:
              print("skip=true")
              print(f"reason=branch_not_listed:{branch}")
          else:
              print("skip=false")
              print("reason=ok")
          print(f"service={service}")
          print(f"environment={environment}")
          PY
        env:
          BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Resolve payload
        id: meta
        if: steps.cfg.outputs.skip != 'true'
        run: |
          SHA="${{ github.event.inputs.head_sha || github.sha }}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "Triggering qa-agent for ${{ github.repository }}@${SHA} service=${{ steps.cfg.outputs.service }}"

      - name: Skip notice
        if: steps.cfg.outputs.skip == 'true'
        run: echo "Skipping qa-agent notify (${{ steps.cfg.outputs.reason }})"

      - name: POST release-readiness
        if: steps.cfg.outputs.skip != 'true'
        env:
          QA_AGENT_BASE_URL: ${{ secrets.QA_AGENT_BASE_URL }}
          QA_AGENT_GATEWAY_TOKEN: ${{ secrets.QA_AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QA_AGENT_BASE_URL:-}" ] || [ -z "${QA_AGENT_GATEWAY_TOKEN:-}" ]; then
            echo "::error::Set secrets QA_AGENT_BASE_URL and QA_AGENT_GATEWAY_TOKEN"
            exit 1
          fi
          BASE="${QA_AGENT_BASE_URL%/}"
          BODY=$(jq -n \
            --arg repo "${{ steps.meta.outputs.repo }}" \
            --arg branch "${{ steps.meta.outputs.branch }}" \
            --arg sha "${{ steps.meta.outputs.sha }}" \
            --arg service "${{ steps.cfg.outputs.service }}" \
            --arg environment "${{ steps.cfg.outputs.environment }}" \
            '{
              repo: $repo,
              branch: $branch,
              head_sha: $sha,
              service: $service,
              ci_conclusion: "success",
              trigger_kind: "ci_master_merge",
              environment: $environment,
              assume_ci_success: true,
              use_temporal: true
            }')
          echo "POST ${BASE}/v2/workflows/release-readiness"
          HTTP_CODE=$(curl -sS -o /tmp/qa-agent-resp.json -w "%{http_code}" \
            -X POST "${BASE}/v2/workflows/release-readiness" \
            -H "Authorization: Bearer ${QA_AGENT_GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/qa-agent-resp.json || true
          echo
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::qa-agent notify failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          if jq -e '.skipped == true' /tmp/qa-agent-resp.json >/dev/null 2>&1; then
            echo "::warning::qa-agent skipped: $(jq -r '.reason' /tmp/qa-agent-resp.json)"
            exit 0
          fi
          echo "qa-agent activated for am-analysis on ${{ steps.meta.outputs.branch }}"
