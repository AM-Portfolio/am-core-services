# Validate observability.yaml contracts (Plane A) — no dashboard generate
name: observability-validate

on:
  pull_request:
    paths:
      - "services/**/observability.yaml"
      - ".github/workflows/observability-validate.yml"
  push:
    branches: [master, main]
    paths:
      - "services/**/observability.yaml"
      - ".github/workflows/observability-validate.yml"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AM-Portfolio/am-observability (schema + doctor)
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-observability
          path: am-observability
          ref: ${{ vars.AM_OBS_REF || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install am-obs deps
        working-directory: am-observability
        run: python -m pip install -r requirements.txt

      - name: Doctor all service manifests
        working-directory: am-observability
        run: |
          set -euo pipefail
          for f in ../services/*/observability.yaml; do
            echo "==> $f"
            python gen.py doctor "$f"
          done
