# Core Services — internal shared libraries CI/CD (NOT client SDKs)
#
# Publishes: common-lib, kafka-lib, analysis-adapter, domains, observability, etc.
# Client SDKs (*-client-lib, am-analysis-sdk) → am-sdk-publish.yml
#
# PR: build/verify only — SNAPSHOT versions, no GitHub Packages deploy
# Push to main/master/feature: publish release artifacts to GitHub Packages

name: Core Libraries Publish

on:
  push:
    branches: [main, master, 'feature/**', 'hotfix/**', 'fix/**']
    paths:
      - "libraries/**"
      - "domain/**"
      - "pom.xml"
  pull_request:
    paths:
      - "libraries/**"
      - "domain/**"
      - "pom.xml"
  workflow_dispatch:

concurrency:
  group: core-libraries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.check.outputs.any }}
      root-pom: ${{ steps.check.outputs.root-pom }}
      libs-changed: ${{ steps.check.outputs.libs-changed }}
      analysis-adapter: ${{ steps.check.outputs.analysis-adapter }}
      api-core-lib: ${{ steps.check.outputs.api-core-lib }}
      cache-lib: ${{ steps.check.outputs.cache-lib }}
      common-event-model: ${{ steps.check.outputs.common-event-model }}
      common-lib: ${{ steps.check.outputs.common-lib }}
      feign-lib: ${{ steps.check.outputs.feign-lib }}
      kafka-lib: ${{ steps.check.outputs.kafka-lib }}
      observability-lib: ${{ steps.check.outputs.observability-lib }}
      security-lib: ${{ steps.check.outputs.security-lib }}
      market-domain: ${{ steps.check.outputs.market-domain }}
      portfolio-domain: ${{ steps.check.outputs.portfolio-domain }}
      trade-domain: ${{ steps.check.outputs.trade-domain }}
      internal-changed: ${{ steps.check.outputs.internal-changed }}
      maven-pl-list: ${{ steps.check.outputs.maven-pl-list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff changed paths
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          path_changed() { echo "$CHANGED" | grep -q "^$1"; }

          root_pom=false
          path_changed "pom.xml" && root_pom=true

          libs_changed=false
          if path_changed "libraries/" || path_changed "domain/" || [ "$root_pom" = true ]; then
            libs_changed=true
          fi
          echo "libs-changed=${libs_changed}" >> "$GITHUB_OUTPUT"

          lib() {
            local prefix="$1"
            local key="$2"
            if path_changed "${prefix}/"; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
              echo "$prefix" >> /tmp/pl_modules.txt
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          : > /tmp/pl_modules.txt

          lib "libraries/am-analysis-adapter" "analysis-adapter"
          lib "libraries/am-api-core-lib" "api-core-lib"
          lib "libraries/am-cache-lib" "cache-lib"
          lib "libraries/am-common-event-model" "common-event-model"
          lib "libraries/am-common-lib" "common-lib"
          lib "libraries/am-feign-lib" "feign-lib"
          lib "libraries/am-kafka-lib" "kafka-lib"
          lib "libraries/am-observability-lib" "observability-lib"
          lib "libraries/am-security-lib" "security-lib"
          lib "domain/am-market-domain" "market-domain"
          lib "domain/am-portfolio-domain" "portfolio-domain"
          lib "domain/am-trade-domain" "trade-domain"

          # Pull in build-order dependencies when a downstream module changed
          enable() {
            echo "$1=true" >> "$GITHUB_OUTPUT"
            echo "$2" >> /tmp/pl_modules.txt
          }
          if grep -q '^kafka-lib=true' "$GITHUB_OUTPUT" \
            || grep -q '^feign-lib=true' "$GITHUB_OUTPUT" \
            || grep -q '^security-lib=true' "$GITHUB_OUTPUT" \
            || grep -q '^observability-lib=true' "$GITHUB_OUTPUT" \
            || grep -q '^analysis-adapter=true' "$GITHUB_OUTPUT"; then
            enable common-lib libraries/am-common-lib
          fi
          if grep -q '^analysis-adapter=true' "$GITHUB_OUTPUT"; then
            enable kafka-lib libraries/am-kafka-lib
          fi
          if grep -q '^security-lib=true' "$GITHUB_OUTPUT"; then
            enable api-core-lib libraries/am-api-core-lib
          fi

          if [ -s /tmp/pl_modules.txt ]; then
            PL_LIST=$(sort -u /tmp/pl_modules.txt | paste -sd, -)
            echo "maven-pl-list=$PL_LIST" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "maven-pl-list=" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          internal=false
          while IFS= read -r file; do
            case "$file" in
              libraries/am-analysis-client-lib/*|libraries/am-market-client-lib/*|libraries/am-portfolio-client-lib/*|libraries/am-trade-client-lib/*|services/am-analysis/am-analysis-sdk/*)
                ;;
              libraries/*|domain/*|pom.xml)
                internal=true
                break
                ;;
            esac
          done <<< "$CHANGED"
          echo "internal-changed=${internal}" >> "$GITHUB_OUTPUT"

          if [ "$root_pom" = true ]; then
            echo "root-pom=true" >> "$GITHUB_OUTPUT"
          else
            echo "root-pom=false" >> "$GITHUB_OUTPUT"
          fi

  # ── PR: single reactor verify (no publish) ────────────────────────────────
  verify-libraries:
    name: Verify changed modules (PR)
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request'
      && needs.detect-changes.outputs.internal-changed == 'true'
      && needs.detect-changes.outputs.maven-pl-list != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Reactor verify (-pl -am)
        run: mvn -B clean verify -pl "${{ needs.detect-changes.outputs.maven-pl-list }}" -am -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  # ── main/master: publish parent POM (non-recursive) ─────────────────────
  publish-root-pom:
    name: Publish parent POM
    needs: detect-changes
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.internal-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Promote parent to release version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if echo "$CURRENT" | grep -q 'SNAPSHOT'; then
            mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DremoveSnapshot -DgenerateBackupPoms=false
          fi
      - name: Deploy parent POM
        run: |
          mvn -B deploy -DskipTests -N > deploy.log 2>&1 || {
            status=$?
            cat deploy.log
            if grep -q "status code: 409" deploy.log || grep -q "Conflict (409)" deploy.log; then
              echo "WARNING: Parent POM version already deployed (409 Conflict). Skipping deploy."
              exit 0
            else
              exit $status
            fi
          }
          cat deploy.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Advance parent to next snapshot and push
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnextSnapshot=true -DgenerateBackupPoms=false
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add pom.xml **/pom.xml
            git commit -m "chore: bump parent and submodules to next snapshot version"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No version changes detected."
          fi

  # ── main/master: library publish (release version, path-filtered) ─────────
  publish-common-lib:
    name: Publish am-common-lib
    needs: [detect-changes, publish-root-pom]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.common-lib == 'true'
      && (needs.publish-root-pom.result == 'success' || needs.publish-root-pom.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-common-lib
      sdk_name: am-common-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-api-core-lib:
    name: Publish am-api-core-lib
    needs: [detect-changes, publish-root-pom]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.api-core-lib == 'true'
      && (needs.publish-root-pom.result == 'success' || needs.publish-root-pom.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-api-core-lib
      sdk_name: am-api-core-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-common-event-model:
    name: Publish am-common-event-model
    needs: [detect-changes, publish-root-pom]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.common-event-model == 'true'
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-common-event-model
      sdk_name: am-common-event-model
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-kafka-lib:
    name: Publish am-kafka-lib
    needs: [detect-changes, publish-common-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.kafka-lib == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-kafka-lib
      sdk_name: am-kafka-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-security-lib:
    name: Publish am-security-lib
    needs: [detect-changes, publish-common-lib, publish-api-core-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.security-lib == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
      && (needs.publish-api-core-lib.result == 'success' || needs.publish-api-core-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-security-lib
      sdk_name: am-security-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-feign-lib:
    name: Publish am-feign-lib
    needs: [detect-changes, publish-common-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.feign-lib == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-feign-lib
      sdk_name: am-feign-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-observability-lib:
    name: Publish am-observability-lib
    needs: [detect-changes, publish-common-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.observability-lib == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-observability-lib
      sdk_name: am-observability-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-cache-lib:
    name: Publish am-cache-lib
    needs: [detect-changes, publish-root-pom]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.cache-lib == 'true'
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-cache-lib
      sdk_name: am-cache-lib
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-market-domain:
    name: Publish am-market-domain
    needs: [detect-changes, publish-common-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.market-domain == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: domain/am-market-domain
      sdk_name: am-market-domain
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-trade-domain:
    name: Publish am-trade-domain
    needs: [detect-changes, publish-common-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.trade-domain == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: domain/am-trade-domain
      sdk_name: am-trade-domain
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  publish-portfolio-domain:
    name: Publish am-portfolio-domain
    needs: [detect-changes, publish-market-domain]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.portfolio-domain == 'true'
      && (needs.publish-market-domain.result == 'success' || needs.publish-market-domain.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: domain/am-portfolio-domain
      sdk_name: am-portfolio-domain
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  # Client SDKs (*-client-lib) are published by am-sdk-publish.yml

  publish-analysis-adapter:
    name: Publish am-analysis-adapter
    needs: [detect-changes, publish-common-lib, publish-kafka-lib]
    if: >-
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
      && needs.detect-changes.outputs.analysis-adapter == 'true'
      && (needs.publish-common-lib.result == 'success' || needs.publish-common-lib.result == 'skipped')
      && (needs.publish-kafka-lib.result == 'success' || needs.publish-kafka-lib.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/publish-library.yml@main
    with:
      language: java
      working_directory: libraries/am-analysis-adapter
      sdk_name: am-analysis-adapter
      action: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'bump parent and submodules to next snapshot version') || contains(github.event.head_commit.message, 'bump version to next snapshot version')) && 'verify' || 'publish' }}
      use_release_version: true
    secrets: inherit

  # am-analysis-client-lib → am-sdk-publish.yml
