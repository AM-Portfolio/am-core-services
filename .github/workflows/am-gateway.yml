name: Gateway Publish

on:
  push:
    branches: ["master", "main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - 'services/am-gateway/**'
      - '.github/workflows/am-gateway.yml'
  pull_request:
    branches: ["master", "main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - 'services/am-gateway/**'
      - '.github/workflows/am-gateway.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Gateway
    permissions:
      # Nested deploy-preprod pushes helm/ci-image.yaml on feature branches.
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: 'java'
      working_directory: 'services/am-gateway'
      image_name: 'am-gateway'
      build_context: '.'
    secrets: inherit
