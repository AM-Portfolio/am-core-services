#mongo - connection is configured via environment   variable or default below

server:
  port: ${SERVICE_PORT:8080}
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: am-analysis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${AM_KAFKA_ENABLED:true}
    trade-topic: ${KAFKA_TRADE_TOPIC:am-trade}
    consumer:
      group-id: am-analysis-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      security-protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl-jaas-config: ${KAFKA_JAAS_CONFIG:org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:admin}" password="${KAFKA_PASSWORD:password123}";}
  data:
    mongodb:
      uri: ${MONGODB_CONNECTION_URL:${URL:mongodb://admin:password123@localhost:27017/analysis?authSource=admin}}
      database: ${MONGODB_DATABASE:analysis}
      authentication-database: ${MONGODB_AUTH_DATABASE:admin}
    redis:
      host: ${REDIS_HOSTNAME:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

logging:
  level:
    root: INFO
    com.am.analysis: INFO
    com.am.feign: INFO
    am.trade: INFO
    com.am.portfolio.client.market.invoker: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO

am:
  security:
    enabled: true
    proxy-name: "analysis"
    oidc:
      jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8001/realms/am-realm/protocol/openid-connect/certs}
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8001/realms/am-realm}
      client-id: ${OAUTH2_CLIENT_ID:am-analysis-client}
      client-secret: ${OAUTH2_CLIENT_SECRET:secret}
    public-paths:
      - "/actuator/**"
      - "/analysis/actuator/**"

  kafka:
    enabled: ${AM_KAFKA_ENABLED:true}
  observability:
    enabled: ${AM_OBSERVABILITY_ENABLED:true}
    request-log:
      enabled: ${AM_OBSERVABILITY_REQUEST_LOG_ENABLED:true}
    sanitize:
      preview-bytes: ${AM_OBSERVABILITY_SANITIZE_PREVIEW_BYTES:256}
  analysis:
    adapter:
      market:
        enabled: true # Enable/disable Market Event Listener
      portfolio:
        enabled: true # Enable/disable Portfolio Event Listener
      trade:
        enabled: true # Enable/disable Trade Event Listener
      ingestion:
        enabled: true # Enable/disable Analysis Ingestion Service

  services:
    market-data:
      url: ${MARKET_DATA_URL:http://localhost:8092} # Default to standard port, can be overridden

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      portfolioService:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      tradeService:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      portfolioService:
        timeout-duration: 3s
      tradeService:
        timeout-duration: 3s
  retry:
    instances:
      portfolioService:
        max-attempts: 3
        wait-duration: 500ms
      tradeService:
        max-attempts: 3
        wait-duration: 500ms

# Actuator + Tracing + OTLP Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: mongo,redis,readinessState
        liveness:
          include: livenessState
  health:
    mongo:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

otel:
  service:
    name: ${spring.application.name}
    namespace: am-core-services
