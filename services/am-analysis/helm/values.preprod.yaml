# values.preprod.yaml — am-analysis
#
# PURPOSE: Environment-specific Vault paths and non-secret runtime config.
# Preprod app host only — am.asrax.in reserved for prod

environment: preprod

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    otel:
      path: "apps/data/preprod/infra/observability"
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
    kafka:
      path: "apps/data/preprod/infra/kafka"
    redis:
      path: "apps/data/preprod/infra/redis"
    market-data:
      path: "apps/data/preprod/services/am-market-data"
    identity-oidc:
      path: "apps/data/preprod/services/am-identity"
    service-oauth:
      path: "apps/data/preprod/services/am-analysis"

# Non-secret runtime config ONLY
# Anything available in Vault must NOT appear here (except documented public URL fallback)
env:
  SPRING_PROFILES_ACTIVE: "preprod"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT" # Protocol setting, not a secret
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256" # Mechanism setting, not a secret
  MARKET_DATA_URL: "https://am-preprod.asrax.in/market"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /analysis
          pathType: Prefix
