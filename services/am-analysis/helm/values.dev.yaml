# Dev environment overrides for am-analysis
environment: dev

replicaCount: 1

# Minimal resources for shared dev namespace
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/dev/infra/observability"
    mongodb:
      path: "apps/data/dev/infra/mongodb"
    kafka:
      path: "apps/data/dev/infra/kafka"
    redis:
      path: "apps/data/dev/infra/redis"
    market-data:
      path: "apps/data/dev/services/am-market-data"
    identity-oidc:
      path: "apps/data/dev/services/am-identity"
    service-oauth:
      path: "apps/data/dev/services/am-analysis"

# Dev-specific env vars (point to dev cluster services)
env:
  SPRING_PROFILES_ACTIVE: "dev"
  # Must match am-portfolio / kafka-ui "dev". A stale SPRING_KAFKA_BOOTSTRAP_SERVERS
  # pointing at kafka.asrax.in:9092 left am-analysis-group-v2 EMPTY on the real dev cluster
  # (lag on am-portfolio-update) while the pod quietly consumed a different broker.
  KAFKA_BOOTSTRAP_SERVERS: "kafka-dev.asrax.in:9094"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-dev.asrax.in:9094"
  PROJ_KAFKA_BOOTSTRAP_SERVERS: "kafka-dev.asrax.in:9094"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"

hostAliases:
  - ip: "203.174.22.129"
    hostnames:
      - "redis.asrax.in"
      - "mongodb.asrax.in"
      - "kafka.asrax.in"

probes:
  port: 8080
  startup:
    path: "/actuator/health"
    failureThreshold: 30 # 30 * 10s = 300s (5 minutes) to allow for slow Spring Boot startup
    periodSeconds: 10
  liveness:
    path: "/actuator/health"
  readiness:
    path: "/actuator/health"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /analysis
          pathType: Prefix
