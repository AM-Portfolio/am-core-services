# CI rebuild trigger: 2026-07-29-redeploy-analysis
environment: prod

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /analysis
          pathType: Prefix

# Vault enabled — injects all secrets at runtime
vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    kafka:
      path: "apps/data/prod/infra/kafka"
    redis:
      path: "apps/data/prod/infra/redis"
    market-data:
      path: "apps/data/prod/services/am-market-data"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-analysis"

# Non-secret env vars
env:
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  MARKET_DATA_URL: "https://am.asrax.in/market"
