# Local amctl identity — matches CI image_name
name: am-analysis
release: am-analysis
image: ghcr.io/am-portfolio/am-analysis
runtime: java
language: java
dockerfile: Dockerfile
context: .
github:
  repo: AM-Portfolio/am-core-services
  deploy_workflow: direct-deploy.yml
  service: am-analysis
  # workflow_dispatch ref — must be default branch once workflow is registered
  ref: master
deploy:
  # Cluster apply after local build+push. CLI --via / AM_DEPLOY_VIA override this.
  # actions = GitHub Direct Deploy (same Helm as CI)
  # helm    = laptop Helm against VPS kubeconfig
  via: actions
  # skip_github_actions: true   # equivalent to via: helm
