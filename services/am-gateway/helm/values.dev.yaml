# Pre-production environment overrides for am-gateway
environment: dev
language: java

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi


# Vault enabled — role and token management now handled centrally
vault:
  enabled: true
  secretPaths:
    kafka:
      path: "apps/data/dev/infra/kafka"
    redis:
      path: "apps/data/dev/infra/redis"
    identity-oidc:
      path: "apps/data/dev/services/am-identity"
    service-oauth:
      path: "apps/data/dev/services/am-gateway"

# Non-secret env vars pointing to preprod cluster services
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"

hostAliases:
  - ip: "203.174.22.129"
    hostnames:
      - "redis.asrax.in"
      - "mongodb.asrax.in"
      - "kafka.asrax.in"

probes:
  port: 8080
  startup:
    path: "/actuator/health"
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: "/actuator/health"
  readiness:
    path: "/actuator/health"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /v1/streams
          pathType: Prefix
