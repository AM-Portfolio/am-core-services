# Pre-production environment overrides for am-gateway
# Preprod app host only — am.asrax.in reserved for prod
environment: preprod
language: java

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    path: "/actuator/health"
  readiness:
    path: "/actuator/health"

# Vault enabled — role and token management now handled centrally
vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/preprod/infra/observability"
    kafka:
      path: "apps/data/preprod/infra/kafka"
    redis:
      path: "apps/data/preprod/infra/redis"
    identity-oidc:
      path: "apps/data/preprod/services/am-identity"
    service-oauth:
      path: "apps/data/preprod/services/am-gateway"
    market-data:
      path: "apps/data/preprod/services/am-market-data"

# Non-secret env vars pointing to preprod cluster services
env:
  SPRING_PROFILES_ACTIVE: "preprod"
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  # Public gateway URL used when in-cluster URL is unavailable (Vault URL preferred)
  MARKET_DATA_URL: "https://am-preprod.asrax.in/market"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /v1/streams
          pathType: Prefix
        - path: /gateway
          pathType: Prefix
