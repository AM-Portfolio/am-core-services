# Production environment overrides for am-gateway
# Service-level Ingress (same model as am-identity).
# CI rebuild trigger: 2026-07-14
environment: prod
language: java

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    path: "/actuator/health"
  readiness:
    path: "/actuator/health"

# Vault enabled — role and token management now handled centrally
vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    kafka:
      path: "apps/data/prod/infra/kafka"
    redis:
      path: "apps/data/prod/infra/redis"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-gateway"
    market-data:
      path: "apps/data/prod/services/am-market-data"

# Non-secret env vars pointing to prod cluster services
env:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  MARKET_DATA_URL: "https://am.asrax.in/market"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /v1/streams
          pathType: Prefix
        - path: /gateway
          pathType: Prefix
