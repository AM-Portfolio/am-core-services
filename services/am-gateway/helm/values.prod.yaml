# Pre-production environment overrides for am-gateway
environment: prod
language: java

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    path: "/actuator/health"
  readiness:
    path: "/actuator/health"

# Vault enabled — role and token management now handled centrally
vault:
  enabled: true
  secretPaths:
    kafka:
      path: "apps/data/prod/infra/kafka"
    redis:
      path: "apps/data/prod/infra/redis"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-gateway"

# Non-secret env vars pointing to preprod cluster services
env:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
