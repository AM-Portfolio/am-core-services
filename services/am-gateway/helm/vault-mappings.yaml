vault:
  secretPaths:
    kafka:
      mappings:
        KAFKA_BOOTSTRAP_SERVERS: "bootstrap_servers"
        KAFKA_JAAS_CONFIG: "__jaas__"
        KAFKA_USERNAME: "username"
        KAFKA_PASSWORD: "password"
    redis:
      mappings:
        REDIS_HOSTNAME: "host"
        REDIS_PASSWORD: "password"
        REDIS_PORT: "port"

    identity-oidc:
      mappings:
        OIDC_JWKS_URI: "OIDC_JWKS_URL"
        OIDC_ISSUER_URI: "OIDC_ISSUER"

    service-oauth:
      mappings:
        OAUTH2_CLIENT_ID: "AM_GATEWAY_STREAMING_CLIENT_ID"
        OAUTH2_CLIENT_SECRET: "AM_GATEWAY_STREAMING_CLIENT_SECRET"

    market-data:
      mappings:
        MARKET_DATA_URL: "URL"
