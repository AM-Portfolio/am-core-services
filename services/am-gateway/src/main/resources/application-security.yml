am:
  security:
    enabled: true
    proxy-name: "gateway"
    oidc:
      jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8001/realms/am-realm/protocol/openid-connect/certs}
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8001/realms/am-realm}
      client-id: ${OAUTH2_CLIENT_ID:am-gateway-client}
      client-secret: ${OAUTH2_CLIENT_SECRET:secret}
    local-mock:
      enabled: ${AM_LOCAL_MOCK_ENABLED:false}
      user-id: "local-dev-user"
      username: "Local Developer"
      email: "local-dev@am.com"
      roles:
        - "ROLE_USER"
        - "ROLE_ADMIN"
    public-paths:
      - "/actuator/**"
      - "/v1/streams"
      - "/v1/streams/**"
      - "/v1/streams-fallback"
      - "/v1/streams-fallback/**"


