server:
  port: ${SERVICE_PORT:8080}

spring:
  application:
    name: am-mcp-server
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="password123";}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:password123@localhost:27017/?authSource=admin}
      database: ${SPRING_DATA_MONGODB_DATABASE:mcp}
    redis:
      host: ${REDIS_HOSTNAME:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ── MCP Server (HTTP/SSE for any MCP client: ChatGPT, Claude, Cursor, …) ──────
spring.ai.mcp.server:
  name: am-platform
  version: 1.0.0
  stdio: false
  # Traefik strip-prefix /mcp → backend paths /sse and /message
  sse-message-endpoint: /message

# ── Swagger / OpenAPI Documentation (SPT discovers APIs from /v3/api-docs) ─────
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    displayRequestDuration: true
  show-actuator: true

# ── AM Platform Config (all runtime values here — override via env vars) ──────
am:
  defaults:
    user-id: ${AM_DEFAULT_USER:user1}

  auth:
    url: ${AM_AUTH_URL:http://localhost:8001}
    static-token: ${AM_STATIC_TOKEN:} # Leave empty → auto-login via username/password below
    username: ${AM_AUTH_USER:ssd2658@gmail.com}
    password: ${AM_AUTH_PASS:@M1unish}
    refresh-buffer-sec: 60

  services:
    ai-agent-url: ${AM_AI_AGENT_URL:http://localhost:8100}
    portfolio-url: ${AM_PORTFOLIO_URL:http://localhost:8060}

  # ── Tool Group Toggles ── set false to disable a group without recompiling ──
  tools:
    portfolio:
      enabled: ${AM_TOOLS_PORTFOLIO_ENABLED:true}
    trade:
      enabled: ${AM_TOOLS_TRADE_ENABLED:true}
    market:
      enabled: ${AM_TOOLS_MARKET_ENABLED:true}
    analysis:
      enabled: ${AM_TOOLS_ANALYSIS_ENABLED:true}
    ai-agent:
      enabled: ${AM_TOOLS_AI_AGENT_ENABLED:true}

  timeouts:
    connect-ms: 3000
    read-ms: 15000
    ai-agent-read-ms: 90000

  mcp:
    max-response-chars: 8000 # Truncate tool responses — LLMs have context limits
    tool-timeout-ms: 20000 # Hard kill for any tool taking > 20s

# ── Connection Pool ───────────────────────────────────────────────────────────
am.http.pool:
  max-total: 50
  max-per-route: 20
  ttl-seconds: 30

# ── Resilience4j — Circuit Breaker per domain ─────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      am-analysis:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      am-market:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
      am-trade:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
      am-ai-agent:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 60s
  retry:
    instances:
      am-analysis:
        maxAttempts: 2
        waitDuration: 500ms
      am-market:
        maxAttempts: 2
        waitDuration: 300ms

# ── Actuator + Tracing + OTLP ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
      # Kafka health contributor is not always registered; avoid boot failure.
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include: mongo,redis,readinessState
        liveness:
          include: livenessState
  metrics:
    tags:
      # Required for Grafana Technical / Services Service dropdown
      application: ${spring.application.name}
  health:
    mongo:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

otel:
  service:
    name: ${spring.application.name}
    namespace: am-core-services

am.observability:
  enabled: ${AM_OBSERVABILITY_ENABLED:true}
  request-log:
    enabled: ${AM_OBSERVABILITY_REQUEST_LOG_ENABLED:true}
  sanitize:
    preview-bytes: ${AM_OBSERVABILITY_SANITIZE_PREVIEW_BYTES:256}



# ── Logging ───────────────────────────────────────────────────────────────────
# HTTP/SSE mode: normal logging. For local stdio Claude Desktop, activate mcp-stdio.
spring.profiles.include: security
logging:
  level:
    com.am.mcp: DEBUG
    org.springframework.ai.mcp: WARN

---
# ── DEV profile ───────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.am.mcp: DEBUG
    org.springframework.ai.mcp: DEBUG
