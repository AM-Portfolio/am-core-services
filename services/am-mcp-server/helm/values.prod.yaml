# Production environment overrides for am-mcp-server
# Service-level Ingress (same model as am-identity).
environment: prod

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Vault enabled - injects auth credentials at runtime
vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    kafka:
      path: "apps/data/prod/infra/kafka"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    auth:
      path: "apps/data/prod/services/am-auth"
    redis:
      path: "apps/data/prod/infra/redis"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-mcp-server"

# Probe overrides: Argo prod syncs values from master; keep these explicit so a
# short aggregate /actuator/health timeout cannot CrashLoop a ~90s Java startup.
probes:
  port: 8080
  startup:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 35
    failureThreshold: 6

# Public HTTPS on am.asrax.in (Traefik strip-prefix). Image tag comes from CI/Helm, not here.
# Mongo URI comes from Vault apps/data/prod/infra/mongodb (agent inject overrides env).
# Force readiness group without mongo so a flaky Contabo handshake cannot block rollout.
env:
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  AM_AUTH_URL: "https://am.asrax.in/identity"
  AM_AI_AGENT_URL: "https://am.asrax.in/ai"
  AM_PORTFOLIO_URL: "https://am.asrax.in/portfolio"
  AM_TRADE_URL: "https://am.asrax.in/trade"
  MARKET_DATA_URL: "https://am.asrax.in/market"
  SPRING_DATA_MONGODB_DATABASE: "analysis"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.priority: "200"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /mcp
          pathType: Prefix
        - path: /message
          pathType: Prefix
