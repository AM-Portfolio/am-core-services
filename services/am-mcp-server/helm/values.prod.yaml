# Production environment overrides for am-mcp-server
# Service-level Ingress (same model as am-identity).
environment: prod

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Vault enabled - injects auth credentials at runtime
vault:
  enabled: true
  role: "am-backend-role"
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    kafka:
      path: "apps/data/prod/infra/kafka"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    auth:
      path: "apps/data/prod/services/am-auth"
    redis:
      path: "apps/data/prod/infra/redis"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-mcp-server"

# Non-secret env vars pointing to prod cluster services
env:
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  AM_AUTH_URL: "http://am-identity.am-apps-prod.svc.cluster.local:8080"
  AM_AI_AGENT_URL: "http://am-ai-agent.am-apps-prod.svc.cluster.local:8100"
  AM_PORTFOLIO_URL: "http://am-portfolio.am-apps-prod.svc.cluster.local:8060"
  MARKET_DATA_URL: "https://am.asrax.in/market"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /mcp
          pathType: Prefix
