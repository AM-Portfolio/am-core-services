# Production environment overrides for am-mcp-server
# Service-level Ingress (same model as am-identity).
environment: prod

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Vault enabled — injects auth credentials at runtime
vault:
  enabled: true
  role: "am-mcp-server-role"
  secretPaths:
    auth:
      path: "apps/data/prod/services/am-auth"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-mcp-server"

# Non-secret env vars pointing to prod cluster services
env:
  SPRING_PROFILES_ACTIVE: "prod"
  AM_AUTH_URL: "http://am-auth.am-apps-prod.svc.cluster.local:8001"
  AM_AI_AGENT_URL: "http://am-ai-agent.am-apps-prod.svc.cluster.local:8100"
  AM_PORTFOLIO_URL: "http://am-portfolio.am-apps-prod.svc.cluster.local:8060"
  MARKET_DATA_URL: "https://am.asrax.in/market"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /mcp
          pathType: Prefix
