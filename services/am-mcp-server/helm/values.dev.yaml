# Dev environment overrides for am-mcp-server
environment: dev

replicaCount: 1

# Java uses -Xmx512m — keep headroom above heap
resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 200m
    memory: 384Mi

# Vault is enabled in dev
vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/dev/infra/observability"
    mongodb:
      path: "apps/data/dev/infra/mongodb"
    redis:
      path: "apps/data/dev/infra/redis"
    identity-oidc:
      path: "apps/data/dev/services/am-identity"
    service-oauth:
      path: "apps/data/dev/services/am-mcp-server"

# Public HTTPS on am-dev.asrax.in (Traefik strip-prefix). Image tag comes from CI/Helm.
env:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb.infra.svc.cluster.local:27017/mcp"
  REDIS_PORT: "6379"
  AM_AUTH_URL: "https://am-dev.asrax.in/identity"
  AM_AI_AGENT_URL: "https://am-dev.asrax.in/ai"
  AM_AI_AGENT_CHAT_PATH: "/v1/ai/chat"
  AM_PORTFOLIO_URL: "https://am-dev.asrax.in/portfolio"
  AM_TRADE_URL: "https://am-dev.asrax.in/trade"
  MARKET_DATA_URL: "https://am-dev.asrax.in/market"
  AM_TOOLS_ANALYSIS_ENABLED: "true"
  AM_TOOLS_MARKET_ENABLED: "true"
  AM_TOOLS_PORTFOLIO_ENABLED: "true"
  AM_TOOLS_BASKET_ENABLED: "true"
  AM_TOOLS_TRADE_ENABLED: "true"
  AM_TOOLS_AI_AGENT_ENABLED: "true"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.priority: "200"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        # Strip /mcp -> /sse. SSE endpoint event announces /message (absolute),
        # so also route /message to this service (strip is a no-op for that path).
        - path: /mcp
          pathType: Prefix
        - path: /message
          pathType: Prefix
