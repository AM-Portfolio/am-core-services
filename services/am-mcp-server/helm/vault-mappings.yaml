vault:
  secretPaths:
    kafka:
      mappings:
        KAFKA_BOOTSTRAP_SERVERS: "bootstrap_servers"
        KAFKA_JAAS_CONFIG: "__jaas__"
        KAFKA_SASL_USERNAME: "username"
        KAFKA_SASL_PASSWORD: "password"
    mongodb:
      mappings:
        SPRING_DATA_MONGODB_URI: "url"
    redis:
      mappings:
        REDIS_HOSTNAME: "host"
        REDIS_PASSWORD: "password"
        REDIS_PORT: "port"

    identity-oidc:
      mappings:
        OIDC_JWKS_URI: "OIDC_JWKS_URL"
        OIDC_ISSUER_URI: "OIDC_ISSUER"

    service-oauth:
      mappings:
        OAUTH2_CLIENT_ID: "AM_MCP_CLIENT_ID"
        OAUTH2_CLIENT_SECRET: "AM_MCP_CLIENT_SECRET"
